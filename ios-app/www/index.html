<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101e2d">
<meta name="description" content="夜の部屋を飛び回る蚊をパチンコで狙い撃つ、ブラウザで遊べる全9面のゲーム。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%9F%3C/text%3E%3C/svg%3E">
<title>蚊スナイパー｜安眠防衛戦</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#101e2d;color:#fff;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;height:100%;overflow:hidden}
main{height:100dvh;max-width:650px;margin:auto;position:relative;background:#152a39;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{width:100%;height:100%;display:block;touch-action:none}
header{position:absolute;top:max(20px,env(safe-area-inset-top));left:22px;right:22px;pointer-events:none;display:flex;justify-content:space-between;align-items:start}
small{font-size:11px;letter-spacing:3px;color:#9ac7cd}
h1{margin:4px 0;font-size:24px}
#stats{text-align:right;font-size:16px;line-height:1.7}
#hint{position:absolute;top:calc(max(20px,env(safe-area-inset-top)) + 64px);width:100%;padding:0 16px;text-align:center;pointer-events:none;color:#b8d6d3;font-size:13px;line-height:1.6}
.overlay{position:absolute;inset:0;background:#0a1824b8;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.card{max-width:360px}
h2{font-size:38px;margin:12px 0}
p{line-height:1.9;color:#bbd4d7}
button{font:inherit;border:0;border-radius:40px;background:#e4f593;color:#1a302e;padding:17px 32px;font-weight:800;cursor:pointer}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.chip{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom));font-size:12px;padding:10px 14px;background:#ffffff18;color:#fff}
#guideToggle{left:20px}
#sound{right:20px}
#guide{padding:12px 20px;background:#ffffff24;color:#fff}
b{color:#e4f593}
.me{color:#e4f593;font-weight:700}
.sub{padding:10px 16px;font-size:13px;background:#ffffff24;color:#fff;margin:4px}
button:disabled{opacity:.6;cursor:default}
</style>
</head>
<body>
<main>
  <canvas id="c"></canvas>
  <header>
    <div><small>MIDNIGHT HUNT</small><h1>蚊スナイパー</h1></div>
    <div id="stats"></div>
  </header>
  <div id="hint">パチンコを下へ引いて、離す</div>
  <button id="guideToggle" class="chip">説明あり</button>
  <button id="sound" class="chip">音 ON</button>
  <div class="overlay" id="overlay">
    <div class="card">
      <small>安眠防衛戦</small>
      <h2 id="title">その一匹が、<br>眠らせない。</h2>
      <p id="desc">夜の部屋を飛び回る蚊を狙い撃ち。<br>ゴムを引いて、指を離すだけ。<br>最後の羽音を、止めよう。<br>次の部屋からは花瓶や電球に注意！</p>
      <div style="margin:16px 0" id="guideRow"><button id="guide" aria-pressed="true">説明あり ✓</button></div>
      <button id="start">狩りをはじめる</button>
      <div id="shop" style="display:none;margin-top:14px"><button id="restore" class="sub">購入を復元</button><button id="toTitle" class="sub">タイトルへ</button></div>
      <p style="font-size:12px" id="foot">音を出すと羽音も楽しめます</p>
    </div>
  </div>
</main>
<script>
'use strict';
const $ = s => document.querySelector(s);
const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
const vib = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };
// 古いSafari向け roundRect
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}

/* ---------- 面の定義 ---------- */
const LEVELS = [
  { name: '基本の狙い撃ち',     tip: '画面下の玉を下へ引いて、指を離す' },
  { name: '花瓶に注意',         tip: '花瓶に当てるとやり直し。蚊が離れた瞬間を狙おう' },
  { name: '電球に注意',         tip: '天井の電球も壊れ物' },
  { name: '扇風機の風を読む',   tip: '風で玉が右へ流れる。少し左を狙おう' },
  { name: 'カーテンの隙を狙う', tip: 'カーテンの裏にいる蚊には当たらない' },
  { name: '外すと蚊が飛び立つ', tip: '止まっている今がチャンス。外すと一斉に飛ぶ' },
  { name: '構えると逃げる蚊',   tip: 'ゴムを引くと蚊が左右へ逃げる。逃げた先を狙おう' },
  { name: '高速の周回飛行',     tip: '軌道の先を読んで撃とう' },
  { name: '親玉の休憩を狙う',   tip: '大きな親玉は3発で撃退。止まった瞬間がチャンス' }
];
const LAST_LEVEL = LEVELS.length, BONUS_SEC = 20, BOSS_HP = 3;

/* ---------- 説明あり／なし ---------- */
let guideOn = store.get('ka-guide') !== 'off';
function syncGuide() {
  $('#guide').textContent = guideOn ? '説明あり ✓' : '説明なし ✓';
  $('#guide').setAttribute('aria-pressed', String(guideOn));
  $('#guideToggle').textContent = guideOn ? '説明あり' : '説明なし';
  $('#hint').style.display = guideOn ? 'block' : 'none';
}
function toggleGuide() { guideOn = !guideOn; store.set('ka-guide', guideOn ? 'on' : 'off'); syncGuide(); }
$('#guide').onclick = toggleGuide;
$('#guideToggle').onclick = toggleGuide;
syncGuide();

/* ---------- 状態 ---------- */
const c = $('#c'), g = c.getContext('2d'), ov = $('#overlay'), stats = $('#stats');
let W, H, dpr;
let outcome = 'intro', running = false, level = 1;
let kills = 0, hits = 0, shots = 0, elapsed = 0, time = 0, last = 0;
let bugs = [], balls = [], sparks = [], obstacles = [], drag = null;
let bonus = false, bonusCount = 0, racket = { x: 0, y: 0 }, sweeping = false, zapQueue = 0, zapClock = 0;
let muted = store.get('ka-muted') === '1', audio, osc, gain;
let run = null;
let records = [];
try { records = JSON.parse(store.get('ka-records', '[]')) || []; } catch (e) { records = []; }
let bestBonus = Number(store.get('ka-bonus-best', 0)) || 0;

const rnd = (a, b) => a + Math.random() * (b - a);
const base = () => ({ x: W / 2, y: H - 135 });

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = c.clientWidth; H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const o of obstacles) { o.x = W * o.fx; o.y = H * o.fy; }
}
addEventListener('resize', resize);
resize();

/* ---------- 音 ---------- */
function initAudio() {
  try {
    audio ??= new (window.AudioContext || window.webkitAudioContext)();
    audio.resume();
    if (!osc) {
      osc = audio.createOscillator(); gain = audio.createGain();
      osc.type = 'sawtooth'; osc.frequency.value = 185; gain.gain.value = 0;
      osc.connect(gain).connect(audio.destination); osc.start();
    }
  } catch (e) {}
}
function ping(f = 750) {
  if (!audio || muted) return;
  const o = audio.createOscillator(), v = audio.createGain(), t = audio.currentTime;
  o.frequency.setValueAtTime(f, t); o.frequency.exponentialRampToValueAtTime(160, t + .12);
  v.gain.setValueAtTime(.12, t); v.gain.exponentialRampToValueAtTime(.001, t + .15);
  o.connect(v).connect(audio.destination); o.start(); o.stop(t + .16);
}
function crash() {
  if (!audio || muted) return;
  const buf = audio.createBuffer(1, audio.sampleRate * .25, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) * .3;
  const n = audio.createBufferSource(); n.buffer = buf; n.connect(audio.destination); n.start();
}
function syncSound() { $('#sound').textContent = '音 ' + (muted ? 'OFF' : 'ON'); }
$('#sound').onclick = () => { muted = !muted; store.set('ka-muted', muted ? '1' : '0'); initAudio(); syncSound(); };
syncSound();

/* ---------- 記録 ---------- */
function newRun() { run = { id: Date.now(), shots: 0, hits: 0, time: 0 }; }
const accuracy = () => run && run.shots ? run.hits / run.shots : 0;
// 1プレイ＝1件。面を進めるたび・失敗するたびに同じ記録を上書きする
function saveRun(cleared) {
  const prev = records.find(r => r.id === run.id);
  if (prev && prev.cleared > cleared) cleared = prev.cleared;
  records = records.filter(r => r.id !== run.id);
  records.push({ id: run.id, cleared, accuracy: accuracy(), time: run.time });
  records.sort((a, b) => b.cleared - a.cleared || b.accuracy - a.accuracy || a.time - b.time);
  records = records.slice(0, 10);
  store.set('ka-records', JSON.stringify(records));
}
function rankingHTML(n = 5) {
  if (!records.length) return 'まだ記録がありません';
  return records.slice(0, n).map((r, i) => {
    const s = `${i + 1}位 · ${r.cleared}面 · ${(r.accuracy * 100).toFixed(1)}% · ${r.time.toFixed(1)}秒`;
    return run && r.id === run.id ? `<span class="me">${s} ← 今回</span>` : s;
  }).join('<br>');
}
if (records.length) {
  const r = records[0];
  $('#foot').innerHTML = `端末内ベスト ${r.cleared}面 · ${(r.accuracy * 100).toFixed(1)}%<br>音を出すと羽音も楽しめます`;
}

/* ---------- 面の進行 ---------- */
function makeBug(i) {
  return { x: rnd(40, W - 40), y: rnd(145, H * .58), vx: rnd(-32, 32) * (1 + level * .12), vy: rnd(-20, 20),
           phase: rnd(0, 7), slot: i, hp: 1, boss: false, alert: false, flee: 0, flash: 0 };
}
function spawn() {
  bugs = Array.from({ length: 4 }, (_, i) => makeBug(i));
  if (level === 9) Object.assign(bugs[1], { boss: true, hp: BOSS_HP, vx: bugs[1].vx * .6 });
  obstacles = [];
  if (level >= 2) obstacles.push({ type: 'vase', fx: .28, fy: .50, r: 23 });
  if (level >= 3) obstacles.push({ type: 'bulb', fx: .65, fy: .28, r: 21 });
  if (level >= 4) obstacles.push({ type: 'vase', fx: .79, fy: .55, r: 23 });
  if (level >= 5) obstacles.push({ type: 'bulb', fx: .22, fy: .29, r: 21 });
  for (const o of obstacles) { o.x = W * o.fx; o.y = H * o.fy; o.broken = false; }
}
function begin() {
  bonus = false; balls = []; sparks = []; drag = null;
  kills = 0; hits = 0; shots = 0; elapsed = 0;
  spawn(); running = true; outcome = 'play'; ov.style.display = 'none';
  const L = LEVELS[level - 1];
  $('#hint').innerHTML = `第${level}夜「${L.name}」<br>${L.tip}`;
  syncGuide();
}
function finish(failed) {
  normalCard();
  run.shots += shots; run.hits += hits; run.time += elapsed;
  running = false; drag = null; balls = [];
  outcome = failed ? 'fail' : 'clear';
  saveRun(failed ? level - 1 : level);
  const acc = Math.round(accuracy() * 100);
  $('#title').textContent = failed ? 'あっ、割れた！' : '安眠、確保。';
  $('#desc').innerHTML = failed
    ? `第${level}夜 · 家具を壊してしまった。<br>蚊が離れた瞬間を狙おう。<br>通算命中率 ${acc}%`
    : `第${level}夜 · ${kills}匹を撃退<br>${elapsed.toFixed(1)}秒 ／ ${shots}発<br>` +
      (level < LAST_LEVEL ? '次の部屋は、もう少し手強い。<br>' : '') + `通算命中率 ${acc}%`;
  $('#start').textContent = failed ? 'この面をやり直す'
    : level === LAST_LEVEL ? '最後のボーナスへ' : level % 3 === 0 ? '草原ボーナスへ' : '次の部屋へ';
  $('#foot').textContent = '';
  setTimeout(() => { if (!running) ov.style.display = 'flex'; }, failed ? 700 : 350);
}
function showComplete() {
  normalCard();
  outcome = 'complete'; bonus = false; bugs = []; sparks = [];
  $('#title').textContent = '九夜、安眠達成！';
  $('#desc').innerHTML = '端末内ランキング<br>' + rankingHTML() + '<br>草原ベスト ' + bestBonus + '匹';
  $('#start').textContent = '新しい挑戦';
}
$('#start').onclick = () => {
  initAudio();
  switch (outcome) {
    case 'intro': case 'complete': level = 1; newRun(); begin(); break;
    case 'fail': begin(); break;
    case 'clear': if (level % 3 === 0) startBonus(); else { level++; begin(); } break;
    case 'bonusDone':
      if (level === LAST_LEVEL) showComplete();
      else if (level >= FREE_LEVELS && !unlocked) showPaywall();
      else { level++; begin(); }
      break;
    case 'paywall': buy(); break;
  }
};

/* ---------- 続きの解放（アプリ内課金） ---------- */
// 第1〜3夜＋草原ボーナスは無料。第4〜9夜は買い切りで解放。
// ブラウザ版（GitHub Pages）には課金の仕組みがないので、最初から全部遊べる。
const FREE_LEVELS = 3, PRODUCT_ID = 'io.github.kenjicreate.kasniper.full';
const IAP = window.Capacitor?.isNativePlatform?.() ? window.Capacitor.Plugins?.NativePurchases : null;
let unlocked = !IAP || store.get('ka-full') === '1';
let priceText = '', buying = false;
const INTRO = { title: $('#title').innerHTML, desc: $('#desc').innerHTML, start: $('#start').textContent, foot: $('#foot').innerHTML };
function setUnlocked() { unlocked = true; store.set('ka-full', '1'); }
async function refreshPurchases() {
  if (!IAP) return;
  try {
    const { purchases } = await IAP.getPurchases({ productType: 'inapp' });
    if ((purchases || []).some(p => p.productIdentifier === PRODUCT_ID && !p.revocationDate)) setUnlocked();
  } catch (e) {}
}
async function loadPrice() {
  if (!IAP) return;
  try {
    const { products } = await IAP.getProducts({ productIdentifiers: [PRODUCT_ID], productType: 'inapp' });
    if (products && products[0]) priceText = products[0].priceString;
    if (outcome === 'paywall') showPaywall();
  } catch (e) {}
}
refreshPurchases(); loadPrice();

function normalCard() {
  $('#shop').style.display = 'none';
  $('#guideRow').style.display = 'block';
  $('#start').disabled = false;
}
function showPaywall(msg = '') {
  outcome = 'paywall'; bonus = false; bugs = []; sparks = [];
  $('#title').innerHTML = '続きの六夜へ';
  $('#desc').innerHTML = '扇風機の風、カーテンの影、逃げる蚊、<br>そして最後の夜に待つ「親玉」。<br>一度の購入で、第4〜9夜がずっと遊べます。' +
    (msg ? `<br><b>${msg}</b>` : '');
  $('#start').textContent = buying ? '処理中…' : `続きを解放する${priceText ? `（${priceText}）` : ''}`;
  $('#start').disabled = buying;
  $('#restore').disabled = buying;
  $('#guideRow').style.display = 'none';
  $('#shop').style.display = 'block';
  $('#foot').textContent = '';
  ov.style.display = 'flex';
}
function showThanks() {
  normalCard();
  outcome = 'bonusDone';   // 「次へ」で第4夜に進む
  $('#title').textContent = 'ありがとう！';
  $('#desc').innerHTML = '第4〜9夜が解放されました。<br>ここからが本当の夜です。';
  $('#start').textContent = '第4夜へ';
  ov.style.display = 'flex';
}
async function buy() {
  if (buying || !IAP) return;
  buying = true; showPaywall();
  let msg = '';
  try {
    await IAP.purchaseProduct({ productIdentifier: PRODUCT_ID, productType: 'inapp', quantity: 1 });
    setUnlocked();
  } catch (e) {
    const m = String((e && e.message) || e);
    if (!/cancel/i.test(m)) msg = '購入できませんでした。時間をおいてもう一度お試しください。';
  }
  buying = false;
  if (unlocked) showThanks(); else showPaywall(msg);
}
$('#restore').onclick = async () => {
  if (buying || !IAP) return;
  buying = true; showPaywall();
  try { await IAP.restorePurchases(); } catch (e) {}
  await refreshPurchases();
  buying = false;
  if (unlocked) showThanks(); else showPaywall('復元できる購入が見つかりませんでした。');
};
$('#toTitle').onclick = () => {
  if (buying) return;
  normalCard();
  outcome = 'intro';
  $('#title').innerHTML = INTRO.title; $('#desc').innerHTML = INTRO.desc;
  $('#start').textContent = INTRO.start; $('#foot').innerHTML = INTRO.foot;
};

/* ---------- 草原ボーナス ---------- */
const meadowBug = () => ({ x: rnd(25, W - 25), y: rnd(140, H - 100), vx: rnd(-70, 70), vy: rnd(-45, 45), phase: rnd(0, 7) });
function startBonus() {
  bonus = true; bonusCount = 0; elapsed = 0; balls = []; sparks = []; obstacles = []; drag = null;
  zapQueue = 0; zapClock = 0; racket = { x: W / 2, y: H * .6 };
  bugs = Array.from({ length: 45 }, meadowBug);
  running = true; outcome = 'bonus'; ov.style.display = 'none';
  $('#hint').textContent = `指${matchMedia('(pointer:fine)').matches ? 'やマウス' : ''}でラケットを動かして、まとめて撃退！ ${BONUS_SEC}秒`;
}
// 前回位置から今回位置までを掃くので、素早く振っても取りこぼさない
function sweep(p) {
  const a = racket; racket = p;
  for (let i = bugs.length - 1; i >= 0; i--) {
    const bug = bugs[i];
    if (segmentHit(a.x, a.y / 1.25, p.x, p.y / 1.25, bug.x, bug.y / 1.25, 48)) {
      bugs.splice(i, 1); bonusCount++; zapQueue++; ping(900);
      for (let j = 0; j < 9; j++) sparks.push({ x: bug.x, y: bug.y, vx: rnd(-150, 150), vy: rnd(-150, 150), life: .4 });
    }
  }
}
function finishBonus() {
  bestBonus = Math.max(bestBonus, bonusCount);
  store.set('ka-bonus-best', String(bestBonus));
  normalCard();
  running = false; sweeping = false; outcome = 'bonusDone';
  $('#title').textContent = '草原、すっきり！';
  $('#desc').textContent = bonusCount + '匹を電撃退治！ ベスト ' + bestBonus + '匹。';
  $('#start').textContent = level === LAST_LEVEL ? '結果を見る' : '次の部屋へ';
  ov.style.display = 'flex';
}

/* ---------- 当たり判定 ---------- */
function segmentT(ax, ay, bx, by, x, y) {
  const dx = bx - ax, dy = by - ay;
  return Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1)));
}
function segmentHit(ax, ay, bx, by, x, y, r) {
  const t = segmentT(ax, ay, bx, by, x, y);
  return Math.hypot(ax + (bx - ax) * t - x, ay + (by - ay) * t - y) <= r;
}
const bugRadius = b => b.boss ? 40 : 25;
const behindCurtain = b => level === 5 && !bonus && b.x > W * .33 && b.x < W * .67;
function shatter(o) {
  o.broken = true;
  for (let j = 0; j < 30; j++) sparks.push({ x: o.x, y: o.y, vx: rnd(-180, 180), vy: rnd(-180, 180), life: .8 });
  crash(); vib([60, 30, 60]);
  finish(true);
}
function hitBug(bug, ball) {
  hits++; ball.dead = true;
  for (let j = 0; j < 12; j++) sparks.push({ x: bug.x, y: bug.y, vx: rnd(-120, 120), vy: rnd(-120, 120), life: .5 });
  if (--bug.hp > 0) {            // 親玉：まだ倒れない
    bug.flash = .25; bug.flee = (bug.x < W / 2 ? 1 : -1) * 220; ping(420); vib(15);
    return;
  }
  bugs.splice(bugs.indexOf(bug), 1); kills++; ping(); vib(25);
}

/* ---------- 入力 ---------- */
function pos(e) { const r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
c.onpointerdown = e => {
  if (!running) return;
  const p = pos(e), b = base();
  if (bonus) { c.setPointerCapture(e.pointerId); sweeping = true; racket = p; sweep(p); return; }
  if (Math.hypot(p.x - b.x, p.y - b.y) < 105) {
    c.setPointerCapture(e.pointerId);
    drag = { x: b.x, y: b.y };
    if (level === 7) bugs.forEach(bug => { bug.flee = (bug.x < b.x ? -1 : 1) * 320; });
    move(e);
  }
};
function move(e) {
  if (bonus && running) {
    if (sweeping || e.pointerType === 'mouse') sweep(pos(e));
    return;
  }
  if (!drag) return;
  const p = pos(e), b = base(), dx = p.x - b.x, dy = Math.max(0, p.y - b.y), len = Math.hypot(dx, dy), k = Math.min(1, 85 / (len || 1));
  drag = { x: b.x + dx * k, y: b.y + dy * k };
}
c.onpointermove = move;
c.onpointerup = () => {
  sweeping = false;
  if (!drag) return;
  const b = base(), dx = b.x - drag.x, dy = b.y - drag.y;
  if (running && Math.hypot(dx, dy) > 10) { balls.push({ x: drag.x, y: drag.y, vx: dx * 10, vy: dy * 10, trail: [] }); shots++; }
  drag = null;
};
c.onpointercancel = () => { drag = null; sweeping = false; };
c.oncontextmenu = e => e.preventDefault();

/* ---------- 描画ヘルパー ---------- */
function line(x, y, X, Y, col, width = 2) { g.strokeStyle = col; g.lineWidth = width; g.beginPath(); g.moveTo(x, y); g.lineTo(X, Y); g.stroke(); }
function circle(x, y, r, col) { g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill(); }
function drawRoom() {
  const light = g.createRadialGradient(W * .7, H * .24, 0, W * .7, H * .24, W * .8);
  light.addColorStop(0, '#294a59'); light.addColorStop(1, '#122431');
  g.fillStyle = light; g.fillRect(0, 0, W, H);
  g.fillStyle = '#0c1e30'; g.fillRect(W * .54, 115, W * .36, H * .3);
  g.strokeStyle = '#557785'; g.lineWidth = 7; g.strokeRect(W * .54, 115, W * .36, H * .3);
  line(W * .72, 115, W * .72, 115 + H * .3, '#557785', 5);
  circle(W * .79, 155, 20, '#e6edc2');
  g.fillStyle = '#162b3a'; g.beginPath(); g.ellipse(W * .15, H * .62, 90, 30, 0, 0, 7); g.fill();
  g.fillStyle = '#263e4b'; g.fillRect(0, H * .65, W, H * .35);
  line(0, H * .65, W, H * .65, '#4b6069');
  g.fillStyle = '#405867'; g.beginPath(); g.roundRect(W * .05, H * .53, W * .38, H * .13, 15); g.fill();
  g.fillStyle = '#a0b7b5'; g.beginPath(); g.roundRect(W * .08, H * .54, W * .17, H * .06, 12); g.fill();
}
function drawMeadow() {
  const sky = g.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#265a69'); sky.addColorStop(.6, '#84b191'); sky.addColorStop(1, '#234f38');
  g.fillStyle = sky; g.fillRect(0, 0, W, H);
  circle(W * .8, 160, 34, '#fff0aa');
  for (let i = 0; i < 85; i++) { const x = (i * 53) % W, y = H * .55 + (i * 31) % (H * .45); line(x, y, x + Math.sin(time + i) * 8, y - 30 - (i % 5) * 9, '#4e8952', 3); }
}
function drawRacket() {
  const { x, y } = racket;
  line(x, y + 44, x + 24, y + 126, '#ecc56a', 12);
  g.save(); g.translate(x, y); g.scale(1, 1.25);
  g.strokeStyle = '#d6f99c'; g.lineWidth = 5; g.beginPath(); g.arc(0, 0, 48, 0, Math.PI * 2); g.stroke();
  g.save(); g.clip();
  for (let i = -45; i < 48; i += 12) { line(i, -48, i, 48, '#c9f2d488', 1); line(-48, i, 48, i, '#c9f2d488', 1); }
  g.restore(); g.restore();
}
function drawObstacles() {
  for (const o of obstacles) {
    if (o.broken) continue;
    const { x, y, r } = o;
    if (o.type === 'bulb') {
      line(x, 100, x, y - r - 10, '#8c9ca6', 2);
      g.shadowColor = '#ffe899'; g.shadowBlur = 20; circle(x, y, r, '#ffe8a0'); g.shadowBlur = 0;
      line(x - 7, y + r - 2, x + 7, y + r - 2, '#b0b8b8', 9);
      line(x - 7, y, x, y + 10, '#d29743', 2); line(x, y + 10, x + 7, y, '#d29743', 2);
    } else {
      g.fillStyle = '#bce0e8'; g.beginPath(); g.moveTo(x - 10, y - r); g.lineTo(x + 10, y - r);
      g.bezierCurveTo(x + 5, y - 5, x + r + 10, y + 5, x + r, y + 15);
      g.quadraticCurveTo(x, y + r + 16, x - r, y + 15);
      g.bezierCurveTo(x - r - 10, y + 5, x - 5, y - 5, x - 10, y - r); g.fill();
      line(x - 12, y - r, x + 12, y - r, '#e2f5f6', 4); line(x - 12, y + 9, x + 12, y + 9, '#648ea6', 4);
      line(x - 35, y + r + 18, x + 35, y + r + 18, '#657780', 7);
    }
  }
}
function drawBug(bug) {
  g.save(); g.translate(bug.x, bug.y);
  if (bug.boss) g.scale(1.8, 1.8);
  const resting = level === 9 && !bonus && bug.resting;
  const flap = resting ? .3 : Math.sin(time * 90);
  g.fillStyle = '#c4e5e57d'; g.beginPath();
  g.ellipse(-9, -5, 12, 4, flap, 0, 7); g.ellipse(9, -5, 12, 4, -flap, 0, 7); g.fill();
  for (const s of [-1, 1]) { line(0, 0, s * 12, 9, '#a0bdc0'); line(s * 12, 9, s * 17, 5, '#a0bdc0'); }
  const body = bug.flash > 0 ? '#f1936e' : '#10171d';
  g.fillStyle = body; g.beginPath(); g.ellipse(0, 2, 5, 12, .2, 0, 7); g.fill();
  circle(0, -9, 5, body); circle(2, -10, 2, '#f1936e');
  line(0, -11, 3, -22, '#bad0d0', 1);
  g.restore();
  if (bug.boss) for (let i = 0; i < BOSS_HP; i++) circle(bug.x - 12 + i * 12, bug.y - 48, 4, i < bug.hp ? '#f1936e' : '#ffffff33');
}
function drawSling() {
  const b = base(), p = drag || b;
  line(b.x, b.y + 48, b.x, b.y + 13, '#b58251', 16);
  line(b.x, b.y + 16, b.x - 26, b.y - 20, '#b58251', 13);
  line(b.x, b.y + 16, b.x + 26, b.y - 20, '#b58251', 13);
  line(b.x - 26, b.y - 20, p.x, p.y, '#e5d7a7', 4);
  line(b.x + 26, b.y - 20, p.x, p.y, '#e5d7a7', 4);
  circle(p.x, p.y, 9, '#e4f593');
  if (drag) for (let i = 1; i < 12; i++) {
    const x = p.x + (b.x - p.x) * i * .8, y = p.y + (b.y - p.y) * i * .8;
    if (y < 120) break;
    circle(x, y, 2, '#e4f59366');
  }
}
// 説明あり：第1夜の最初の1発まで、指の動きを実演する
function drawFingerDemo() {
  const b = base(), t = (time % 2.2) / 2.2;
  const pull = t < .15 ? 0 : t < .6 ? (t - .15) / .45 : t < .7 ? 1 : 0;
  const alpha = t < .7 ? Math.min(1, t / .15) : Math.max(0, 1 - (t - .7) / .15);
  const x = b.x, y = b.y + pull * 75;
  g.globalAlpha = alpha * .85;
  line(b.x - 26, b.y - 20, x, y, '#e5d7a7aa', 3); line(b.x + 26, b.y - 20, x, y, '#e5d7a7aa', 3);
  circle(x, y + 4, 17, '#ffffff55');
  g.fillStyle = '#ffffffcc'; g.beginPath(); g.roundRect(x - 9, y + 4, 18, 46, 9); g.fill();
  if (t >= .7) { g.globalAlpha = (1 - (t - .7) / .3) * .8; for (let i = 1; i < 6; i++) circle(b.x, b.y - i * 24 - (t - .7) * 200, 3, '#e4f593'); }
  g.globalAlpha = 1;
}

/* ---------- メインループ ---------- */
function updateBugs(dt) {
  for (const bug of bugs) {
    bug.phase += dt;
    if (bug.flash > 0) bug.flash -= dt;
    const stopped = Math.sin(bug.phase * 1.4) > .85;
    if (!bonus && level === 8) {
      bug.x = W / 2 + Math.sin(time * 2.8 + bug.phase) * W * .35;
      bug.y = H * .35 + Math.cos(time * 2.8 + bug.phase) * H * .16;
    } else if (!bonus && level === 9) {
      bug.resting = (time + bug.phase) % 5 < 2;
      if (bug.resting) {
        const tx = W * (.2 + .2 * bug.slot), ty = H * .42;
        bug.x += (tx - bug.x) * Math.min(1, dt * 10); bug.y += (ty - bug.y) * Math.min(1, dt * 10);
      } else {
        const sp = bug.boss ? .6 : 1;
        bug.x += Math.sin(time * 8 + bug.phase) * 180 * sp * dt;
        bug.y += Math.cos(time * 5 + bug.phase) * 120 * sp * dt;
      }
    } else if (!bonus && level === 6 && !bug.alert) {
      // とまっている
    } else if (!stopped) {
      bug.x += (bug.vx + Math.sin(time * 4 + bug.phase) * 27) * dt;
      bug.y += (bug.vy + Math.cos(time * 3 + bug.phase) * 22) * dt;
    }
    if (bug.flee) { bug.x += bug.flee * dt; bug.flee *= Math.exp(-5 * dt); if (Math.abs(bug.flee) < 5) bug.flee = 0; }
    const bottom = bonus ? H - 100 : H * .61;
    if (bug.x < 25 || bug.x > W - 25) { bug.vx *= -1; bug.flee = 0; bug.x = Math.max(25, Math.min(W - 25, bug.x)); }
    if (bug.y < 130 || bug.y > bottom) { bug.vy *= -1; bug.y = Math.max(130, Math.min(bottom, bug.y)); }
  }
}
function updateBalls(dt) {
  for (const ball of balls) {
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 8) ball.trail.shift();
    const ox = ball.x, oy = ball.y;
    if (level === 4) ball.vx += 120 * dt;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    // 蚊と家具、玉の進路で先に当たる方を採用
    let first = null, firstT = 2;
    for (const bug of bugs) {
      if (behindCurtain(bug) || !segmentHit(ox, oy, ball.x, ball.y, bug.x, bug.y, bugRadius(bug))) continue;
      const t = segmentT(ox, oy, ball.x, ball.y, bug.x, bug.y);
      if (t < firstT) { firstT = t; first = { bug }; }
    }
    for (const o of obstacles) {
      if (o.broken || !segmentHit(ox, oy, ball.x, ball.y, o.x, o.y, o.r + 6)) continue;
      const t = segmentT(ox, oy, ball.x, ball.y, o.x, o.y);
      if (t < firstT) { firstT = t; first = { o }; }
    }
    if (first?.o) { shatter(first.o); return; }
    if (first?.bug) hitBug(first.bug, ball);
  }
  if (level === 6 && balls.some(b => !b.dead && (b.y < 0 || b.x < 0 || b.x > W))) bugs.forEach(b => { b.alert = true; });
  balls = balls.filter(b => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 30);
}
function frame(ms) {
  const dt = Math.min((ms - last) / 1000, .035) || 0;
  last = ms; time = ms / 1000;
  if (running) elapsed += dt;

  if (zapQueue > 0) { zapClock -= dt; if (zapClock <= 0) { vib(18); zapQueue--; zapClock = .075; } }
  if (running) {
    updateBugs(dt);
    if (bonus) {
      if (elapsed >= BONUS_SEC) finishBonus();
      else if (bugs.length < 40) bugs.push(meadowBug());
    } else {
      updateBalls(dt);
      if (running && !bugs.length) finish(false);
    }
  }
  if (gain) {
    gain.gain.setTargetAtTime(running && !muted ? .018 * Math.min(bugs.length, 4) : 0, audio.currentTime, .1);
    osc.frequency.setTargetAtTime(190 + Math.sin(time * 4) * 35, audio.currentTime, .1);
  }

  if (bonus) drawMeadow(); else drawRoom();
  drawObstacles();
  for (const bug of bugs) drawBug(bug);
  if (!bonus && level === 5) {
    g.fillStyle = '#82586e'; g.fillRect(W * .33, 120, W * .34, H * .48);
    for (let x = W * .35; x < W * .67; x += 15) line(x, 120, x, H * .48 + 120, '#634154', 3);
  }
  if (!bonus && level === 4) {
    circle(45, H * .65, 26, '#8babb9');
    for (let j = 0; j < 3; j++) { const a = time * 15 + j * 2.094; line(45, H * .65, 45 + Math.cos(a) * 23, H * .65 + Math.sin(a) * 23, '#d0e5dd', 7); }
    for (let j = 0; j < 3; j++) line(80, H * .58 + j * 25, 120 + (time * 50) % W, H * .58 + j * 25, '#bce7eb44', 2);
  }
  for (const ball of balls) { ball.trail.forEach((p, i) => circle(p.x, p.y, 2 + i * .35, '#e4f59355')); circle(ball.x, ball.y, 5, '#edffab'); }
  sparks = sparks.filter(s => s.life > 0);
  for (const s of sparks) { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; g.globalAlpha = Math.max(0, s.life * 2); circle(s.x, s.y, 3, '#e4f593'); }
  g.globalAlpha = 1;
  if (bonus) drawRacket();
  else {
    drawSling();
    if (running && guideOn && level === 1 && shots === 0 && !drag) drawFingerDemo();
  }

  stats.innerHTML = bonus
    ? `<b>BONUS</b> · ${Math.max(0, BONUS_SEC - elapsed).toFixed(1)} 秒<br>撃退 <b>${bonusCount}</b> 匹`
    : `<span style="font-size:12px">第${level}夜 / ${LAST_LEVEL}</span> · 残り <b>${bugs.length}</b> 匹<br><span style="font-size:12px;color:#9db8bd">${elapsed.toFixed(1)} 秒 ／ ${shots} 発</span>`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => {
  if (!audio) return;
  if (document.hidden) audio.suspend(); else if (running) audio.resume();
});
</script>
</body>
