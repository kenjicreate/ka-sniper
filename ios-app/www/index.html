<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1b28">
<meta name="description" content="夜の部屋で迫ってくる蚊をパチンコで狙い撃つ、全9夜のゲーム。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%9F%3C/text%3E%3C/svg%3E">
<title>蚊スナイパー｜安眠防衛戦</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#0d1b28;color:#fff;font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;height:100%;overflow:hidden}
main{height:100dvh;max-width:650px;margin:auto;position:relative;background:#152a39;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{width:100%;height:100%;display:block;touch-action:none}
header{position:absolute;top:max(18px,env(safe-area-inset-top));left:18px;right:18px;pointer-events:none;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
small{font-size:10px;letter-spacing:3px;color:#9ac7cd}
h1{margin:2px 0 0;font-size:22px;letter-spacing:1px;text-shadow:0 2px 8px #0008}
#stats{text-align:right;font-size:13px;line-height:1.55;background:#0a17229c;border:1px solid #ffffff14;border-radius:14px;padding:7px 12px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#stats .hearts{font-size:17px;letter-spacing:2px}
#stats .on{color:#ff6f86;text-shadow:0 0 8px #ff6f8688}
#stats .off{color:#ffffff30}
#stats .sub{font-size:11px;color:#9db8bd}
#hint{position:absolute;bottom:calc(172px + env(safe-area-inset-bottom));width:100%;padding:0 16px;text-align:center;pointer-events:none;color:#cfe4e1;font-size:12.5px;line-height:1.6;text-shadow:0 1px 4px #000c}
.overlay{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#10263acc,#060f17ee);display:flex;align-items:center;justify-content:center;padding:22px;text-align:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.card{max-width:360px;width:100%;background:linear-gradient(180deg,#183447f2,#0f2333f2);border:1px solid #ffffff1c;border-radius:28px;padding:26px 22px 20px;box-shadow:0 20px 60px #0009}
h2{font-size:34px;margin:10px 0 8px;line-height:1.25;letter-spacing:1px}
p{line-height:1.85;color:#bfd6d9;margin:10px 0}
button{font:inherit;border:0;border-radius:40px;background:linear-gradient(180deg,#eefaa6,#d6ec7c);color:#1a302e;padding:16px 30px;font-weight:800;cursor:pointer;box-shadow:0 6px 18px #d6ec7c33}
button:active{transform:scale(.97)}
button:disabled{opacity:.55;cursor:default;transform:none}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}
.chip{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));font-size:12px;padding:9px 14px;background:#0a1722b3;color:#fff;border:1px solid #ffffff22;box-shadow:none;font-weight:700}
#guideToggle{left:16px}
#sound{right:16px}
.sub-btn{padding:11px 18px;font-size:13px;background:#ffffff1f;color:#fff;box-shadow:none;margin:4px}
b{color:#e4f593}
.me{color:#e4f593;font-weight:700}
.danger{color:#ff8a9a}
</style>
</head>
<body>
<main>
  <canvas id="c"></canvas>
  <header>
    <div><small>MIDNIGHT HUNT</small><h1>蚊スナイパー</h1></div>
    <div id="stats"></div>
  </header>
  <div id="hint"></div>
  <button id="guideToggle" class="chip">説明あり</button>
  <button id="sound" class="chip">音 ON</button>
  <div class="overlay" id="overlay">
    <div class="card">
      <small>安眠防衛戦</small>
      <h2 id="title">その一匹が、<br>眠らせない。</h2>
      <p id="desc">夜の部屋を飛び回る蚊を狙い撃ち。<br>ゴムを引いて、指を離すだけ。<br>蚊はすきを見て刺しに来る。<br><span class="danger">♥3回</span>刺されたら、眠れない。</p>
      <div style="margin:14px 0" id="guideRow"><button id="guide" class="sub-btn" aria-pressed="true">説明あり ✓</button></div>
      <button id="start">狩りをはじめる</button>
      <div id="subRow" style="display:none;margin-top:12px"><button id="restart" class="sub-btn">第1夜からやり直す</button></div>
      <p style="font-size:11.5px" id="foot">音を出すと羽音も楽しめます</p>
    </div>
  </div>
</main>
<script>
'use strict';
const $ = s => document.querySelector(s);
const store = {
  get(k, d = null) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};
if (!CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath();
  };
}

/* ---------- アプリ（iPhone）でだけ使う機能 ---------- */
const NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
const Plugins = NATIVE ? (window.Capacitor.Plugins || {}) : {};
const Haptics = Plugins.Haptics || null;
const AdMob = Plugins.AdMob || null;
// AdMob の広告ユニット（リワード「続ける」）
const AD_UNIT_ID = 'ca-app-pub-9222119240854607/3821408976';

// 振動：iPhoneは本体の振動機能、Androidなどのブラウザは vibrate
function buzz(kind) {
  if (Haptics) {
    const style = kind === 'heavy' ? 'HEAVY' : kind === 'medium' ? 'MEDIUM' : 'LIGHT';
    try { Haptics.impact({ style }); } catch (e) {}
    return;
  }
  const pattern = kind === 'heavy' ? [90, 40, 90] : kind === 'medium' ? 30 : 15;
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}

/* ---------- 面の定義 ---------- */
const LEVELS = [
  { name: '基本の狙い撃ち',     tip: '玉を下へ引いて離す。刺しに来る蚊を先に撃て' },
  { name: '花瓶に注意',         tip: '花瓶を割ると♥が減る。蚊が離れた瞬間を狙おう' },
  { name: '電球に注意',         tip: '天井の電球も壊れ物。迫る蚊が速くなってきた' },
  { name: '扇風機の風を読む',   tip: '風で玉が右へ流れる。少し左を狙おう' },
  { name: 'カーテンの隙を狙う', tip: 'カーテンの裏の蚊には当たらない。出てきた所を撃て' },
  { name: '外すと蚊が飛び立つ', tip: '止まっている今がチャンス。外すと一斉に飛ぶ' },
  { name: '構えると逃げる蚊',   tip: 'ゴムを引くと蚊が左右へ逃げる。逃げた先を狙おう' },
  { name: '高速の周回飛行',     tip: '軌道の先を読んで撃とう。迫る速さも最高潮' },
  { name: '親玉の休憩を狙う',   tip: '大きな親玉は3発で撃退。止まった瞬間がチャンス' }
];
const LAST_LEVEL = LEVELS.length, BONUS_SEC = 20, BOSS_HP = 3, LIVES = 3;

/* ---------- 説明あり／なし ---------- */
let guideOn = store.get('ka-guide') !== 'off';
function syncGuide() {
  $('#guide').textContent = guideOn ? '説明あり ✓' : '説明なし ✓';
  $('#guide').setAttribute('aria-pressed', String(guideOn));
  $('#guideToggle').textContent = guideOn ? '説明あり' : '説明なし';
  $('#hint').style.display = guideOn ? 'block' : 'none';
}
function toggleGuide() { guideOn = !guideOn; store.set('ka-guide', guideOn ? 'on' : 'off'); syncGuide(); }
$('#guide').onclick = toggleGuide;
$('#guideToggle').onclick = toggleGuide;
syncGuide();

/* ---------- 状態 ---------- */
const c = $('#c'), g = c.getContext('2d'), ov = $('#overlay'), stats = $('#stats');
let W, H, dpr;
let outcome = 'intro', running = false, level = 1;
let kills = 0, hits = 0, shots = 0, elapsed = 0, time = 0, last = 0;
let bugs = [], balls = [], sparks = [], obstacles = [], popups = [], bumps = [], drag = null;
let lives = LIVES, diveClock = 0, diveCount = 0, flashT = 0, shakeT = 0, overCause = '';
let bonus = false, bonusCount = 0, racket = { x: 0, y: 0 }, sweeping = false, zapQueue = 0, zapClock = 0;
let muted = store.get('ka-muted') === '1', audio, osc, gain;
let run = null;
let records = [];
try { records = JSON.parse(store.get('ka-records', '[]')) || []; } catch (e) { records = []; }
let bestBonus = Number(store.get('ka-bonus-best', 0)) || 0;

const rnd = (a, b) => a + Math.random() * (b - a);
const base = () => ({ x: W / 2, y: H - 135 });
const blanketTop = () => H - 82;

function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = c.clientWidth; H = c.clientHeight;
  c.width = W * dpr; c.height = H * dpr;
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  for (const o of obstacles) { o.x = W * o.fx; o.y = H * o.fy; }
}
addEventListener('resize', resize);
resize();

/* ---------- 音 ---------- */
function initAudio() {
  try {
    audio ??= new (window.AudioContext || window.webkitAudioContext)();
    audio.resume();
    if (!osc) {
      osc = audio.createOscillator(); gain = audio.createGain();
      osc.type = 'sawtooth'; osc.frequency.value = 185; gain.gain.value = 0;
      osc.connect(gain).connect(audio.destination); osc.start();
    }
  } catch (e) {}
}
function tone(f1, f2, dur, vol, type = 'sine') {
  if (!audio || muted) return;
  const o = audio.createOscillator(), v = audio.createGain(), t = audio.currentTime;
  o.type = type;
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur * .8);
  v.gain.setValueAtTime(vol, t); v.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(v).connect(audio.destination); o.start(); o.stop(t + dur + .02);
}
const ping = (f = 750) => tone(f, 160, .15, .12);
const biteSound = () => { tone(180, 55, .25, .16, 'square'); setTimeout(() => tone(900, 600, .08, .05), 60); };
function crash() {
  if (!audio || muted) return;
  const buf = audio.createBuffer(1, audio.sampleRate * .25, audio.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) * .3;
  const n = audio.createBufferSource(); n.buffer = buf; n.connect(audio.destination); n.start();
}
function syncSound() { $('#sound').textContent = '音 ' + (muted ? 'OFF' : 'ON'); }
$('#sound').onclick = () => { muted = !muted; store.set('ka-muted', muted ? '1' : '0'); initAudio(); syncSound(); };
syncSound();

/* ---------- 記録 ---------- */
function newRun() { run = { id: Date.now(), shots: 0, hits: 0, time: 0, cont: 0 }; lives = LIVES; }
const accuracy = () => run && run.shots ? run.hits / run.shots : 0;
// 1プレイ＝1件。面を進めるたび・力尽きるたびに同じ記録を上書きする
function saveRun(cleared) {
  const prev = records.find(r => r.id === run.id);
  if (prev && prev.cleared > cleared) cleared = prev.cleared;
  records = records.filter(r => r.id !== run.id);
  records.push({ id: run.id, cleared, accuracy: accuracy(), time: run.time, cont: run.cont });
  records.sort((a, b) => b.cleared - a.cleared || (a.cont || 0) - (b.cont || 0) || b.accuracy - a.accuracy || a.time - b.time);
  records = records.slice(0, 10);
  store.set('ka-records', JSON.stringify(records));
}
function rankingHTML(n = 5) {
  if (!records.length) return 'まだ記録がありません';
  return records.slice(0, n).map((r, i) => {
    const s = `${i + 1}位 · ${r.cleared}夜 · ${(r.accuracy * 100).toFixed(0)}%` + (r.cont ? ` · 続行${r.cont}回` : '') + ` · ${r.time.toFixed(0)}秒`;
    return run && r.id === run.id ? `<span class="me">${s} ← 今回</span>` : s;
  }).join('<br>');
}
const INTRO = { title: $('#title').innerHTML, desc: $('#desc').innerHTML, start: $('#start').textContent };
if (records.length) {
  const r = records[0];
  $('#foot').innerHTML = `端末内ベスト ${r.cleared}夜 · ${(r.accuracy * 100).toFixed(0)}%<br>音を出すと羽音も楽しめます`;
}

/* ---------- 広告（ライフが尽きたときの「続ける」） ---------- */
let adReady = false, adLoading = false, adBusy = false, overMsg = '';
async function initAds() {
  if (!AdMob) return;
  try { await AdMob.initialize({}); } catch (e) {}
  loadAd();
}
async function loadAd() {
  if (!AdMob || adReady || adLoading) return;
  adLoading = true;
  try { await AdMob.prepareRewardVideoAd({ adId: AD_UNIT_ID }); adReady = true; } catch (e) { adReady = false; }
  adLoading = false;
  if (outcome === 'gameover' && !adBusy) showGameOver();
}
// 広告を最後まで見たら 'ok'、途中で閉じたら 'skip'、出せなかったら 'fail'
function playRewardAd() {
  return new Promise(resolve => {
    let earned = false, settled = false;
    const handles = [];
    const finish = v => {
      if (settled) return; settled = true;
      handles.forEach(h => { try { h.remove(); } catch (e) {} });
      resolve(v);
    };
    (async () => {
      try {
        handles.push(await AdMob.addListener('onRewardedVideoAdReward', () => { earned = true; }));
        handles.push(await AdMob.addListener('onRewardedVideoAdDismissed', () => finish(earned ? 'ok' : 'skip')));
        handles.push(await AdMob.addListener('onRewardedVideoAdFailedToShow', () => finish('fail')));
        adReady = false;
        AdMob.showRewardVideoAd().then(() => { earned = true; }).catch(() => finish(earned ? 'ok' : 'fail'));
      } catch (e) { finish('fail'); }
    })();
  });
}
initAds();

/* ---------- 面の進行 ---------- */
function makeBug(i) {
  return { x: rnd(40, W - 40), y: rnd(150, H * .55), vx: rnd(-32, 32) * (1 + level * .12), vy: rnd(-20, 20),
           phase: rnd(0, 7), slot: i, hp: 1, boss: false, alert: false, flee: 0, flash: 0,
           state: 'fly', prog: 0, ang: 0 };
}
function spawn() {
  bugs = Array.from({ length: 4 }, (_, i) => makeBug(i));
  if (level === 9) Object.assign(bugs[1], { boss: true, hp: BOSS_HP, vx: bugs[1].vx * .6 });
  obstacles = [];
  if (level >= 2) obstacles.push({ type: 'vase', fx: .28, fy: .50, r: 23 });
  if (level >= 3) obstacles.push({ type: 'bulb', fx: .65, fy: .28, r: 21 });
  if (level >= 4) obstacles.push({ type: 'vase', fx: .79, fy: .55, r: 23 });
  if (level >= 5) obstacles.push({ type: 'bulb', fx: .22, fy: .29, r: 21 });
  for (const o of obstacles) { o.x = W * o.fx; o.y = H * o.fy; o.broken = false; }
}
function normalCard() {
  $('#subRow').style.display = 'none';
  $('#guideRow').style.display = 'block';
  $('#start').disabled = false;
}
function begin() {
  normalCard();
  bonus = false; balls = []; sparks = []; popups = []; bumps = []; drag = null;
  kills = 0; hits = 0; shots = 0; elapsed = 0; diveCount = 0; flashT = 0; shakeT = 0;
  diveClock = level === 1 ? 4 : 2.6;
  spawn(); running = true; outcome = 'play'; ov.style.display = 'none';
  const L = LEVELS[level - 1];
  $('#hint').innerHTML = `第${level}夜「${L.name}」<br>${L.tip}`;
  syncGuide();
}
function clearNight() {
  run.shots += shots; run.hits += hits; run.time += elapsed;
  running = false; drag = null; balls = [];
  outcome = 'clear';
  saveRun(level);
  const acc = Math.round(accuracy() * 100);
  $('#title').textContent = '安眠、確保。';
  $('#desc').innerHTML = `第${level}夜 · ${kills}匹を撃退<br>${elapsed.toFixed(1)}秒 ／ ${shots}発 ／ 残り${heartsText()}<br>` +
    (level < LAST_LEVEL ? '次の夜は、もっと速く迫ってくる。<br>' : '') + `通算命中率 ${acc}%`;
  $('#start').textContent = level === LAST_LEVEL ? '最後のボーナスへ' : level % 3 === 0 ? '草原ボーナスへ' : '次の夜へ';
  $('#foot').textContent = '';
  setTimeout(() => { if (!running) ov.style.display = 'flex'; }, 450);
}
const heartsText = () => '♥'.repeat(Math.max(0, lives)) + '♡'.repeat(LIVES - Math.max(0, lives));

function loseLife(cause, x, y, text) {
  if (!running) return;
  lives--;
  flashT = .5; shakeT = .4;
  popups.push({ x, y, text, color: '#ff8a9a', life: 1.1, size: 26 });
  buzz('heavy');
  if (lives <= 0) gameOver(cause);
}
function gameOver(cause) {
  run.shots += shots; run.hits += hits; run.time += elapsed;
  running = false; drag = null; balls = [];
  outcome = 'gameover'; overCause = cause; overMsg = '';
  saveRun(level - 1);
  setTimeout(() => { if (outcome === 'gameover') showGameOver(); }, 900);
}
function showGameOver(msg) {
  if (msg !== undefined) overMsg = msg;
  msg = overMsg;
  $('#title').textContent = '眠れない……';
  $('#desc').innerHTML = (overCause === 'bite' ? '3回目、蚊に刺されてしまった。' : '3回目、家具を壊してしまった。') +
    `<br>第${level}夜 · ${kills}匹を撃退` + (msg ? `<br><b>${msg}</b>` : '');
  let label, disabled = false;
  if (!AdMob) label = 'この夜から続ける';
  else if (adBusy) { label = '広告を再生中…'; disabled = true; }
  else if (adReady) label = '広告を見て続ける';
  else if (adLoading) { label = '広告を準備中…'; disabled = true; }
  else label = 'この夜から続ける';   // 広告が用意できないときは、そのまま続けられる
  $('#start').textContent = label;
  $('#start').disabled = disabled;
  $('#restart').disabled = adBusy;
  $('#guideRow').style.display = 'none';
  $('#subRow').style.display = 'block';
  $('#foot').textContent = AdMob ? '広告を最後まで見ると、♥が全回復してこの夜をやり直せます' : '';
  ov.style.display = 'flex';
}
async function continueRun() {
  if (adBusy) return;
  if (AdMob && adReady) {
    adBusy = true; showGameOver();
    if (gain) gain.gain.value = 0;
    const r = await playRewardAd();
    adBusy = false;
    loadAd();
    if (r === 'skip') { showGameOver('広告を最後まで見ると続けられます'); return; }
  } else if (AdMob && adLoading) return;
  run.cont++; lives = LIVES;
  begin();
}
$('#restart').onclick = () => { if (adBusy) return; level = 1; newRun(); begin(); };

function showComplete() {
  normalCard();
  outcome = 'complete'; bonus = false; bugs = []; sparks = [];
  $('#title').textContent = '九夜、安眠達成！';
  $('#desc').innerHTML = '端末内ランキング<br>' + rankingHTML() + '<br>草原ベスト ' + bestBonus + '匹';
  $('#start').textContent = '新しい挑戦';
}
$('#start').onclick = () => {
  initAudio();
  switch (outcome) {
    case 'intro': case 'complete': level = 1; newRun(); begin(); break;
    case 'gameover': continueRun(); break;
    case 'clear': if (level % 3 === 0) startBonus(); else { level++; begin(); } break;
    case 'bonusDone': if (level === LAST_LEVEL) showComplete(); else { level++; begin(); } break;
  }
};

/* ---------- 蚊が刺しに来る ---------- */
// 迫ってくるのは一度に1匹（第7夜からは、たまに2匹）。夜が進むほど、そして同じ夜でも回数を重ねるほど速くなる
const maxDivers = () => level >= 7 ? 2 : 1;
const diveGap = () => Math.max(1.4, 4.6 - level * .25) * rnd(.8, 1.2);
function startDive(bug) {
  const tx = Math.max(40, Math.min(W - 40, W / 2 + rnd(-W * .34, W * .34)));
  const ty = blanketTop() + 4;
  const boost = 1 + diveCount * .12;      // 同じ夜で刺しに来るたびに速くなる
  const slow = bug.boss ? .7 : 1;
  Object.assign(bug, {
    state: 'dive', tx, ty, d0: Math.hypot(tx - bug.x, ty - bug.y) || 1, prog: 0,
    dv: (55 + level * 14) * boost * slow, da: (110 + level * 26) * boost * slow, alert: true, flee: 0
  });
  diveCount++;
}
function bite(bug) {
  bumps.push({ x: bug.tx + rnd(-6, 6), y: bug.ty + rnd(4, 14), r: rnd(5, 7) });
  biteSound();
  Object.assign(bug, { state: 'retreat', rx: rnd(50, W - 50), ry: rnd(150, H * .42), prog: 0 });
  loseLife('bite', bug.x, bug.y - 20, 'チクッ！');
}

/* ---------- 草原ボーナス ---------- */
const meadowBug = () => ({ x: rnd(25, W - 25), y: rnd(140, H - 110), vx: rnd(-70, 70), vy: rnd(-45, 45), phase: rnd(0, 7), state: 'fly', prog: 0 });
function startBonus() {
  normalCard();
  bonus = true; bonusCount = 0; elapsed = 0; balls = []; sparks = []; popups = []; bumps = []; obstacles = []; drag = null;
  zapQueue = 0; zapClock = 0; racket = { x: W / 2, y: H * .6 };
  bugs = Array.from({ length: 45 }, meadowBug);
  running = true; outcome = 'bonus'; ov.style.display = 'none';
  $('#hint').textContent = `指${matchMedia('(pointer:fine)').matches ? 'やマウス' : ''}でラケットを動かして、まとめて撃退！ ${BONUS_SEC}秒`;
}

  line(b.x - 26, b.y - 20, p.x, p.y, '#e5d7a7', 4);
  line(b.x + 26, b.y - 20, p.x, p.y, '#e5d7a7', 4);
  g.fillStyle = '#6b4a32'; g.beginPath(); g.ellipse(p.x, p.y + 2, 13, 8, 0, 0, Math.PI * 2); g.fill();
  g.shadowColor = '#e4f593'; g.shadowBlur = drag ? 14 : 6; circle(p.x, p.y, 8.5, '#e4f593'); g.shadowBlur = 0;
  circle(p.x - 2.5, p.y - 2.5, 2.5, '#fbffe0');
  g.lineCap = 'butt';
  if (drag) for (let i = 1; i < 12; i++) {
    const x = p.x + (b.x - p.x) * i * .8, y = p.y + (b.y - p.y) * i * .8;
    if (y < 120) break;
    circle(x, y, 2.2, '#e4f59377');
  }
}
// 説明あり：第1夜の最初の1発まで、指の動きを実演する
function drawFingerDemo() {
  const b = base(), t = (time % 2.2) / 2.2;
  const pull = t < .15 ? 0 : t < .6 ? (t - .15) / .45 : t < .7 ? 1 : 0;
  const alpha = t < .7 ? Math.min(1, t / .15) : Math.max(0, 1 - (t - .7) / .15);
  const x = b.x, y = b.y + pull * 75;
  g.globalAlpha = alpha * .85;
  line(b.x - 26, b.y - 20, x, y, '#e5d7a7aa', 3); line(b.x + 26, b.y - 20, x, y, '#e5d7a7aa', 3);
  circle(x, y + 4, 17, '#ffffff55');
  g.fillStyle = '#ffffffcc'; g.beginPath(); g.roundRect(x - 9, y + 4, 18, 46, 9); g.fill();
  if (t >= .7) { g.globalAlpha = (1 - (t - .7) / .3) * .8; for (let i = 1; i < 6; i++) circle(b.x, b.y - i * 24 - (t - .7) * 200, 3, '#e4f593'); }
  g.globalAlpha = 1;
}
function drawPopups(dt) {
  popups = popups.filter(p => p.life > 0);
  for (const p of popups) {
    p.life -= dt; p.y -= 40 * dt;
    g.globalAlpha = Math.min(1, p.life * 2);
    g.font = `900 ${p.size}px system-ui, sans-serif`; g.textAlign = 'center';
    g.lineWidth = 5; g.strokeStyle = '#0a1520'; g.strokeText(p.text, p.x, p.y);
    g.fillStyle = p.color; g.fillText(p.text, p.x, p.y);
  }
  g.globalAlpha = 1;
}

/* ---------- メインループ ---------- */
function updateBugs(dt) {
  for (const bug of [...bugs]) {
    bug.phase += dt;
    if (bug.flash > 0) bug.flash -= dt;
    if (bug.state === 'dive') {
      bug.dv = Math.min(520, bug.dv + bug.da * dt);
      const dx = bug.tx - bug.x, dy = bug.ty - bug.y, d = Math.hypot(dx, dy);
      if (d < 12) { bite(bug); continue; }
      const ux = dx / d, uy = dy / d, wob = Math.sin(time * 9 + bug.phase) * 70 * (1 - bug.prog);
      bug.x += (ux * bug.dv - uy * wob) * dt;
      bug.y += (uy * bug.dv + ux * wob) * dt;
      bug.prog = Math.max(bug.prog, Math.min(1, 1 - d / bug.d0));
      bug.ang = Math.atan2(ux, -uy);
      continue;
    }
    if (bug.state === 'retreat') {
      bug.y -= 340 * dt; bug.x += (bug.rx - bug.x) * Math.min(1, dt * 2.5);
      if (bug.y <= bug.ry) bug.state = 'fly';
      continue;
    }
    const stopped = Math.sin(bug.phase * 1.4) > .85;
    if (!bonus && level === 8) {
      const tx = W / 2 + Math.sin(time * 2.8 + bug.phase) * W * .35, ty = H * .35 + Math.cos(time * 2.8 + bug.phase) * H * .16;
      bug.x += (tx - bug.x) * Math.min(1, dt * 8); bug.y += (ty - bug.y) * Math.min(1, dt * 8);
    } else if (!bonus && level === 9) {
      bug.resting = (time + bug.phase) % 5 < 2;
      if (bug.resting) {
        const tx = W * (.2 + .2 * bug.slot), ty = H * .42;
        bug.x += (tx - bug.x) * Math.min(1, dt * 10); bug.y += (ty - bug.y) * Math.min(1, dt * 10);
      } else {
        const sp = bug.boss ? .6 : 1;
        bug.x += Math.sin(time * 8 + bug.phase) * 180 * sp * dt;
        bug.y += Math.cos(time * 5 + bug.phase) * 120 * sp * dt;
      }
    } else if (!bonus && level === 6 && !bug.alert) {
      // とまっている
    } else if (!stopped) {
      bug.x += (bug.vx + Math.sin(time * 4 + bug.phase) * 27) * dt;
      bug.y += (bug.vy + Math.cos(time * 3 + bug.phase) * 22) * dt;
    }
    if (bug.flee) { bug.x += bug.flee * dt; bug.flee *= Math.exp(-5 * dt); if (Math.abs(bug.flee) < 5) bug.flee = 0; }
    const bottom = bonus ? H - 110 : H * .6;
    if (bug.x < 25 || bug.x > W - 25) { bug.vx = -(bug.vx || 0); bug.flee = 0; bug.x = Math.max(25, Math.min(W - 25, bug.x)); }
    if (bug.y < 135 || bug.y > bottom) { bug.vy = -(bug.vy || 0); bug.y = Math.max(135, Math.min(bottom, bug.y)); }
  }
}
function updateDives(dt) {
  diveClock -= dt;
  if (diveClock > 0) return;
  diveClock = diveGap();
  const flyers = bugs.filter(b => b.state === 'fly' && !behindCurtain(b));
  const divers = bugs.filter(b => b.state === 'dive').length;
  if (flyers.length && divers < maxDivers()) startDive(flyers[(Math.random() * flyers.length) | 0]);
}
function updateBalls(dt) {
  for (const ball of balls) {
    if (!running) break;
    ball.trail.push({ x: ball.x, y: ball.y });
    if (ball.trail.length > 8) ball.trail.shift();
    const ox = ball.x, oy = ball.y;
    if (level === 4) ball.vx += 120 * dt;
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    // 蚊と家具、玉の進路で先に当たる方を採用
    let first = null, firstT = 2;
    for (const bug of bugs) {
      if (behindCurtain(bug) || !segmentHit(ox, oy, ball.x, ball.y, bug.x, bug.y, bugRadius(bug))) continue;
      const t = segmentT(ox, oy, ball.x, ball.y, bug.x, bug.y);
      if (t < firstT) { firstT = t; first = { bug }; }
    }
    for (const o of obstacles) {
      if (o.broken || !segmentHit(ox, oy, ball.x, ball.y, o.x, o.y, o.r + 6)) continue;
      const t = segmentT(ox, oy, ball.x, ball.y, o.x, o.y);
      if (t < firstT) { firstT = t; first = { o }; }
    }
    if (first?.o) { ball.dead = true; shatter(first.o); }
    else if (first?.bug) hitBug(first.bug, ball);
  }
  if (level === 6 && balls.some(b => !b.dead && (b.y < 0 || b.x < 0 || b.x > W))) bugs.forEach(b => { b.alert = true; });
  balls = balls.filter(b => !b.dead && b.x > -20 && b.x < W + 20 && b.y > -20 && b.y < H + 30);
}
function frame(ms) {
  const dt = Math.min((ms - last) / 1000, .035) || 0;
  last = ms; time = ms / 1000;
  if (running) elapsed += dt;
  if (flashT > 0) flashT -= dt;
  if (shakeT > 0) shakeT -= dt;

  // ボーナスで倒した数だけ、少しずつ間をあけて振動させる
  if (zapQueue > 0) { zapClock -= dt; if (zapClock <= 0) { buzz('light'); zapQueue--; zapClock = .06; } }
  if (running) {
    if (!bonus) updateDives(dt);
    updateBugs(dt);
    if (bonus) {
      if (elapsed >= BONUS_SEC) finishBonus();
      else if (bugs.length < 40) bugs.push(meadowBug());
    } else {
      updateBalls(dt);
      if (running && !bugs.length) clearNight();
    }
  }
  // 羽音：迫ってくる蚊がいると大きく高くなる
  const maxProg = bonus ? 0 : bugs.reduce((m, b) => b.state === 'dive' ? Math.max(m, b.prog) : m, 0);
  if (gain) {
    const vol = running && !muted && !adBusy ? .014 * Math.min(bugs.length, 4) + .06 * maxProg : 0;
    gain.gain.setTargetAtTime(vol, audio.currentTime, .08);
    osc.frequency.setTargetAtTime(190 + Math.sin(time * 4) * 30 + maxProg * 160, audio.currentTime, .08);
  }

  g.save();
  if (shakeT > 0) g.translate(rnd(-1, 1) * shakeT * 22, rnd(-1, 1) * shakeT * 22);
  if (bonus) drawMeadow(); else drawRoom();
  if (!bonus && level === 4) drawFan(W * .16, H * .70, 40);
  drawObstacles();
  for (const bug of bugs) if (bug.state !== 'dive') drawBug(bug);
  if (!bonus && level === 5) {
    const cg = g.createLinearGradient(W * .33, 0, W * .67, 0);
    cg.addColorStop(0, '#6d4a5d'); cg.addColorStop(.5, '#8a6177'); cg.addColorStop(1, '#6d4a5d');
    g.fillStyle = cg; g.fillRect(W * .33, 120, W * .34, H * .48);
    for (let x = W * .35; x < W * .67; x += 15) line(x, 120, x, curtainBottom(), '#5a3c4d', 3);
    line(W * .31, 118, W * .69, 118, '#9ab0b8', 5);
  }
  if (!bonus) drawBlanket();
  if (!bonus) drawDiveWarnings();
  for (const bug of bugs) if (bug.state === 'dive') drawBug(bug);
  for (const ball of balls) { ball.trail.forEach((p, i) => circle(p.x, p.y, 2 + i * .35, '#e4f59355')); circle(ball.x, ball.y, 5, '#edffab'); }
  sparks = sparks.filter(s => s.life > 0);
  for (const s of sparks) { s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; g.globalAlpha = Math.max(0, s.life * 2); circle(s.x, s.y, 3, s.col || '#e4f593'); }
  g.globalAlpha = 1;
  if (bonus) drawRacket();
  else {
    drawSling();
    if (running && guideOn && level === 1 && shots === 0 && !drag) drawFingerDemo();
  }
  drawPopups(dt);
  g.restore();
  // 迫られているときの赤いふち
  if (maxProg > 0) {
    const v = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * .35, W / 2, H / 2, Math.max(W, H) * .75);
    v.addColorStop(0, '#ff3b5c00'); v.addColorStop(1, `rgba(255,59,92,${(maxProg * maxProg * .55 * (.75 + .25 * Math.sin(time * 18))).toFixed(3)})`);
    g.fillStyle = v; g.fillRect(0, 0, W, H);
  }
  if (flashT > 0) { g.fillStyle = `rgba(255,70,90,${(flashT * .6).toFixed(3)})`; g.fillRect(0, 0, W, H); }

  const hearts = Array.from({ length: LIVES }, (_, i) => `<span class="${i < lives ? 'on' : 'off'}">♥</span>`).join('');
  stats.innerHTML = bonus
    ? `<b>BONUS</b> · ${Math.max(0, BONUS_SEC - elapsed).toFixed(1)} 秒<br>撃退 <b>${bonusCount}</b> 匹`
    : `第${level}夜 / ${LAST_LEVEL} · 残り <b>${bugs.length}</b> 匹<br><span class="hearts">${hearts}</span><br><span class="sub">${elapsed.toFixed(1)} 秒 ／ ${shots} 発</span>`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
document.addEventListener('visibilitychange', () => {
  if (!audio) return;
  if (document.hidden) audio.suspend(); else if (running) audio.resume();
});
</script>
