name: カロリーごはん帳の掲載情報をAppleに送る

# 説明文・スクリーンショット・提出するビルドを App Store Connect に入れる
on:
  workflow_dispatch:
  push:
    branches: [claude/calorie-gohan-spec-prhg0e]
    paths:
      - 'calorie-gohan/store/**'
      - 'calorie-gohan/scripts/asc_store.py'
      - '.github/workflows/calorie-gohan-store.yml'

jobs:
  store:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: calorie-gohan
    steps:
      - uses: actions/checkout@v5

      - name: 合い鍵を整える
        env:
          RAW_KID: ${{ secrets.ASC_KEY_ID }}
          RAW_ISS: ${{ secrets.ASC_ISSUER_ID }}
          RAW_KEY: ${{ secrets.ASC_KEY }}
        run: |
          clean() { printf '%s' "$1" | tr -d '\r\n\t '; }
          KID=$(clean "$RAW_KID"); ISS=$(clean "$RAW_ISS")
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$RAW_KEY" | tr -d '\r' > "$RUNNER_TEMP/keys/AuthKey_$KID.p8"
          { echo "KID=$KID"; echo "ISS=$ISS"; echo "KEYFILE=$RUNNER_TEMP/keys/AuthKey_$KID.p8"; } >> "$GITHUB_ENV"

      - name: 掲載情報を送る
        run: |
          python3 -m venv "$RUNNER_TEMP/asc"
          "$RUNNER_TEMP/asc/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/asc/bin/python" scripts/asc_store.py

      - name: 後片付け
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
