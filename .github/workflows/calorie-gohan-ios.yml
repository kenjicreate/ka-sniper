name: カロリーごはん帳をAppleに送る

# GitHub の「Actions」画面の「Run workflow」ボタンで動かします
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: calorie-gohan
    steps:
      - uses: actions/checkout@v5

      - name: 合い鍵を確認して整える
        env:
          RAW_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          RAW_KID: ${{ secrets.ASC_KEY_ID }}
          RAW_ISS: ${{ secrets.ASC_ISSUER_ID }}
          RAW_KEY: ${{ secrets.ASC_KEY }}
        run: |
          # コピーのときに紛れ込んだ改行・空白を取り除く
          clean() { printf '%s' "$1" | tr -d '\r\n\t '; }
          TEAM=$(clean "$RAW_TEAM"); KID=$(clean "$RAW_KID"); ISS=$(clean "$RAW_ISS")
          ok=1
          [ ${#TEAM} -eq 10 ] || { echo "::error::APPLE_TEAM_ID（チームID）は10文字のはずが ${#TEAM} 文字です"; ok=0; }
          [ ${#KID} -eq 10 ]  || { echo "::error::ASC_KEY_ID（キーID）は10文字のはずが ${#KID} 文字です"; ok=0; }
          [ ${#ISS} -eq 36 ]  || { echo "::error::ASC_ISSUER_ID（発行者ID）は36文字のはずが ${#ISS} 文字です"; ok=0; }
          printf '%s' "$RAW_KEY" | grep -q 'BEGIN PRIVATE KEY' || { echo "::error::ASC_KEY に -----BEGIN PRIVATE KEY----- が入っていません"; ok=0; }
          printf '%s' "$RAW_KEY" | grep -q 'END PRIVATE KEY'   || { echo "::error::ASC_KEY に -----END PRIVATE KEY----- が入っていません"; ok=0; }
          [ "$ok" = 1 ] || exit 1

          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$RAW_KEY" | tr -d '\r' > "$RUNNER_TEMP/keys/AuthKey_$KID.p8"
          {
            echo "TEAM=$TEAM"
            echo "KID=$KID"
            echo "ISS=$ISS"
            echo "KEYFILE=$RUNNER_TEMP/keys/AuthKey_$KID.p8"
          } >> "$GITHUB_ENV"

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: 部品をそろえる
        run: |
          npm ci
          npx cap sync ios

      - name: アプリを組み立てる
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEYFILE" \
            -authenticationKeyID "$KID" \
            -authenticationKeyIssuerID "$ISS" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Apple に送る
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEYFILE" \
            -authenticationKeyID "$KID" \
            -authenticationKeyIssuerID "$ISS"

      - name: 後片付け
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
