<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>蚊スナイパー｜安眠防衛戦</title><style>*{box-sizing:border-box}html,body{margin:0;background:#101e2d;color:#fff;font-family:system-ui;height:100%;overflow:hidden}main{height:100dvh;max-width:650px;margin:auto;position:relative;background:#152a39}canvas{width:100%;height:100%;display:block;touch-action:none}header{position:absolute;top:max(20px,env(safe-area-inset-top));left:22px;right:22px;pointer-events:none;display:flex;justify-content:space-between;align-items:start}small{font-size:11px;letter-spacing:3px;color:#9ac7cd}h1{margin:4px 0;font-size:24px}#stats{text-align:right;font-size:16px;line-height:1.7}#hint{position:absolute;bottom:65px;width:100%;text-align:center;pointer-events:none;color:#b8d6d3;font-size:13px}.overlay{position:absolute;inset:0;background:#0a1824b8;display:flex;align-items:center;justify-content:center;padding:28px;text-align:center;backdrop-filter:blur(5px)}.card{max-width:360px}h2{font-size:38px;margin:12px 0}p{line-height:1.9;color:#bbd4d7}button{font:inherit;border:0;border-radius:40px;background:#e4f593;color:#1a302e;padding:17px 32px;font-weight:800;cursor:pointer}#sound{position:absolute;right:20px;bottom:20px;font-size:12px;padding:10px 14px;background:#ffffff18;color:#fff}b{color:#e4f593}</style><main><canvas id="c"></canvas><header><div><small>MIDNIGHT HUNT</small><h1>蚊スナイパー</h1></div><div id="stats"></div></header><div id="hint">パチンコを下へ引いて、離す</div><button id="guideToggle" style="position:absolute;left:20px;bottom:20px;padding:10px 14px;font-size:12px;background:#ffffff18;color:white">説明あり</button><button id="sound">音 ON</button><div class="overlay" id="overlay"><div class="card"><small>安眠防衛戦</small><h2 id="title">その一匹が、<br>眠らせない。</h2><p id="desc">夜の部屋を飛び回る蚊を狙い撃ち。<br>ゴムを引いて、指を離すだけ。<br>最後の羽音を、止めよう。<br>次の部屋からは花瓶や電球に注意！</p><div style="margin:16px 0"><button id="guide" style="padding:12px 20px;background:#ffffff24;color:white" aria-pressed="true">説明あり ✓</button></div><button id="start">狩りをはじめる</button><p style="font-size:12px">音を出すと羽音も楽しめます</p></div></div></main><script>
let guideOn=true;try{guideOn=localStorage.getItem('ka-guide')!=='off'}catch(e){};function syncGuide(){document.querySelector('#guide').textContent=guideOn?'説明あり ✓':'説明なし ✓';document.querySelector('#guide').setAttribute('aria-pressed',String(guideOn));document.querySelector('#guideToggle').textContent=guideOn?'説明あり':'説明なし';document.querySelector('#hint').style.display=guideOn?'block':'none'}function toggleGuide(){guideOn=!guideOn;try{localStorage.setItem('ka-guide',guideOn?'on':'off')}catch(e){}syncGuide()}document.querySelector('#guide').onclick=toggleGuide;document.querySelector('#guideToggle').onclick=toggleGuide;syncGuide();
const c=document.querySelector('canvas'),g=c.getContext('2d'),ov=document.querySelector('#overlay'),stats=document.querySelector('#stats');let W,H,dpr;function resize(){dpr=Math.min(devicePixelRatio,2);W=c.clientWidth;H=c.clientHeight;c.width=W*dpr;c.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();let outcome="intro",obstacles=[],running=false,level=1,kills=0,shots=0,bugs=[],balls=[],sparks=[],drag=null,time=0,last=0,elapsed=0,muted=false,audio,osc,gain;const rnd=(a,b)=>a+Math.random()*(b-a),base=()=>({x:W/2,y:H-135});function initAudio(){try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();if(!osc){osc=audio.createOscillator();gain=audio.createGain();osc.type='sawtooth';osc.frequency.value=185;gain.gain.value=0;osc.connect(gain).connect(audio.destination);osc.start()}}catch(e){}}function ping(){if(!audio||muted)return;let o=audio.createOscillator(),v=audio.createGain();o.frequency.setValueAtTime(750,audio.currentTime);o.frequency.exponentialRampToValueAtTime(160,audio.currentTime+.12);v.gain.setValueAtTime(.12,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.15);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+.16)}document.querySelector('#sound').onclick=()=>{muted=!muted;initAudio();document.querySelector('#sound').textContent='音 '+(muted?'OFF':'ON')};function spawn(){bugs=Array.from({length:4},()=>({x:rnd(40,W-40),y:rnd(145,H*.58),vx:rnd(-32,32)*(1+level*.12),vy:rnd(-20,20),phase:rnd(0,7),pause:0}));obstacles=[];if(level>=2)obstacles.push({type:'vase',x:W*.28,y:H*.50,r:23,broken:false});if(level>=3)obstacles.push({type:'bulb',x:W*.65,y:H*.28,r:21,broken:false});if(level>=4)obstacles.push({type:'vase',x:W*.79,y:H*.55,r:23,broken:false});if(level>=5)obstacles.push({type:'bulb',x:W*.22,y:H*.29,r:21,broken:false});}
let totalShots=0,totalHits=0,totalTime=0,bestBonus=0,records=[];try{records=JSON.parse(localStorage.getItem("ka-records")||"[]")}catch(e){};
const gimmicks=["基本の狙い撃ち","花瓶に注意","電球に注意","扇風機の風を読む","カーテンの隙を狙う","外すと蚊が飛び立つ","構えると逃げる蚊","高速の周回飛行","親玉の休憩を狙う"];
function saveRun(cleared){records.push({cleared,accuracy:totalShots?totalHits/totalShots:0,time:totalTime});records.sort((a,b)=>b.cleared-a.cleared||b.accuracy-a.accuracy||a.time-b.time);records=records.slice(0,10);try{localStorage.setItem("ka-records",JSON.stringify(records));localStorage.setItem("ka-bonus-best",String(bestBonus))}catch(e){}}
let bonus=false,bonusCount=0,racket={x:180,y:350},sweeping=false,zapQueue=0,zapClock=0;
function begin(){bonus=false;if(level===1&&outcome==='intro'){totalShots=0;totalHits=0;totalTime=0;}balls=[];sparks=[];drag=null;kills=0;shots=0;elapsed=0;spawn();running=true;outcome='play';ov.style.display='none';document.querySelector('#hint').textContent=level===1?'画面下の玉を下へ引いて、指を離す':gimmicks[level-1]+' · 壊れ物に注意';syncGuide();}
function finish(failed){totalShots+=shots;totalHits+=kills;totalTime+=elapsed;running=false;drag=null;balls=[];outcome=failed?'fail':'clear';if(failed)saveRun(level-1);document.querySelector('#title').textContent=failed?'あっ、割れた！':'安眠、確保。';document.querySelector('#desc').innerHTML=failed?`第${level}夜 · 家具を壊してしまった。<br>蚊が離れた瞬間を狙おう。`:`第${level}夜 · ${kills}匹を撃退<br>${elapsed.toFixed(1)}秒 ／ ${shots}発<br>次の部屋は、もう少し手強い。`;document.querySelector('#start').textContent=failed?'この面をやり直す':level===9?'最後のボーナスへ':level%3===0?'草原ボーナスへ':'次の部屋へ';if(!failed)document.querySelector('#desc').innerHTML+=`<br>通算命中率 ${totalShots?Math.round(totalHits/totalShots*100):0}%`;setTimeout(()=>{if(!running)ov.style.display='flex'},failed?700:350);}
document.querySelector('#start').onclick=()=>{initAudio();if(outcome==='complete'){level=1;outcome='intro';begin();return}if(outcome==='clear'&&level%3===0){startBonus();return}if(outcome==='bonusDone'&&level===9){saveRun(9);outcome='complete';bonus=false;document.querySelector('#title').textContent='九夜、安眠達成！';document.querySelector('#desc').innerHTML='端末内ランキング<br>'+records.slice(0,5).map((r,i)=>`${i+1}位 · ${r.cleared}面 · ${(r.accuracy*100).toFixed(1)}% · ${r.time.toFixed(1)}秒`).join('<br>')+'<br>草原ベスト '+bestBonus+'匹';document.querySelector('#start').textContent='新しい挑戦';return}if(outcome==='clear'||outcome==='bonusDone')level++;begin()};
function startBonus(){bonus=true;bonusCount=0;elapsed=0;balls=[];sparks=[];obstacles=[];drag=null;zapQueue=0;zapClock=0;bugs=Array.from({length:45},()=>({x:rnd(25,W-25),y:rnd(140,H-100),vx:rnd(-70,70),vy:rnd(-45,45),phase:rnd(0,7)}));running=true;outcome='bonus';ov.style.display='none';document.querySelector('#hint').textContent='指でラケットを動かして、まとめて撃退！ 20秒';}
function sweep(p){racket=p;for(let i=bugs.length-1;i>=0;i--){let bug=bugs[i];if(Math.hypot((bug.x-p.x)/1.0,(bug.y-p.y)/1.25)<48){bugs.splice(i,1);bonusCount++;zapQueue++;ping();for(let j=0;j<9;j++)sparks.push({x:bug.x,y:bug.y,vx:rnd(-150,150),vy:rnd(-150,150),life:.4});}}}
function finishBonus(){bestBonus=Math.max(bestBonus,bonusCount,Number(localStorage.getItem('ka-bonus-best'))||0);try{localStorage.setItem('ka-bonus-best',String(bestBonus))}catch(e){}running=false;sweeping=false;outcome='bonusDone';document.querySelector('#title').textContent='草原、すっきり！';document.querySelector('#desc').textContent=bonusCount+'匹を電撃退治！ ベスト '+bestBonus+'匹。';document.querySelector('#start').textContent='次の部屋へ';ov.style.display='flex';}
function drawMeadow(){let sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,'#265a69');sky.addColorStop(.6,'#84b191');sky.addColorStop(1,'#234f38');g.fillStyle=sky;g.fillRect(0,0,W,H);circle(W*.8,160,34,'#fff0aa');for(let i=0;i<85;i++){let x=(i*53)%W,y=H*.55+(i*31)%(H*.45);line(x,y,x+Math.sin(time+i)*8,y-30-(i%5)*9,'#4e8952',3);}}
function drawRacket(){let {x,y}=racket;line(x,y+44,x+24,y+126,'#ecc56a',12);g.save();g.translate(x,y);g.scale(1,1.25);g.strokeStyle='#d6f99c';g.lineWidth=5;g.beginPath();g.arc(0,0,48,0,Math.PI*2);g.stroke();g.save();g.clip();for(let i=-45;i<48;i+=12){line(i,-48,i,48,'#c9f2d488',1);line(-48,i,48,i,'#c9f2d488',1);}g.restore();g.restore();}
function segmentHit(ax,ay,bx,by,x,y,r){let dx=bx-ax,dy=by-ay,t=Math.max(0,Math.min(1,((x-ax)*dx+(y-ay)*dy)/(dx*dx+dy*dy||1)));return Math.hypot(ax+dx*t-x,ay+dy*t-y)<=r;}
function shatter(o){o.broken=true;for(let j=0;j<30;j++)sparks.push({x:o.x,y:o.y,vx:rnd(-180,180),vy:rnd(-180,180),life:.8});if(audio&&!muted){let buffer=audio.createBuffer(1,audio.sampleRate*.25,audio.sampleRate),d=buffer.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length)*.3;let n=audio.createBufferSource();n.buffer=buffer;n.connect(audio.destination);n.start()}if(navigator.vibrate)navigator.vibrate([60,30,60]);finish(true);}
function drawObstacles(){for(let o of obstacles){if(o.broken)continue;let {x,y,r}=o;if(o.type==='bulb'){line(x,100,x,y-r-10,'#8c9ca6',2);g.shadowColor='#ffe899';g.shadowBlur=20;circle(x,y,r,'#ffe8a0');g.shadowBlur=0;line(x-7,y+r-2,x+7,y+r-2,'#b0b8b8',9);line(x-7,y,x,y+10,'#d29743',2);line(x,y+10,x+7,y,'#d29743',2)}else{g.fillStyle='#bce0e8';g.beginPath();g.moveTo(x-10,y-r);g.lineTo(x+10,y-r);g.bezierCurveTo(x+5,y-5,x+r+10,y+5,x+r,y+15);g.quadraticCurveTo(x,y+r+16,x-r,y+15);g.bezierCurveTo(x-r-10,y+5,x-5,y-5,x-10,y-r);g.fill();line(x-12,y-r,x+12,y-r,'#e2f5f6',4);line(x-12,y+9,x+12,y+9,'#648ea6',4);line(x-35,y+r+18,x+35,y+r+18,'#657780',7)}}}
function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}c.onpointerdown=e=>{if(!running)return;let p=pos(e),b=base();if(bonus){c.setPointerCapture(e.pointerId);sweeping=true;sweep(p);return}if(Math.hypot(p.x-b.x,p.y-b.y)<105){c.setPointerCapture(e.pointerId);drag={x:b.x,y:b.y};if(level===7)bugs.forEach(bug=>{bug.x=Math.max(25,Math.min(W-25,bug.x+(bug.x<b.x?-65:65)));bug.phase=1});move(e)}};function move(e){if(bonus&&running&&sweeping){sweep(pos(e));return}if(!drag)return;let p=pos(e),b=base(),dx=p.x-b.x,dy=Math.max(0,p.y-b.y),len=Math.hypot(dx,dy),scale=Math.min(1,85/(len||1));drag={x:b.x+dx*scale,y:b.y+dy*scale}}c.onpointermove=move;c.onpointerup=()=>{sweeping=false;if(!drag)return;let b=base(),dx=b.x-drag.x,dy=b.y-drag.y;if(Math.hypot(dx,dy)>10){balls.push({x:drag.x,y:drag.y,vx:dx*10,vy:dy*10,trail:[]});shots++}drag=null};c.onpointercancel=()=>{drag=null;sweeping=false};
function line(x,y,X,Y,col,width=2){g.strokeStyle=col;g.lineWidth=width;g.beginPath();g.moveTo(x,y);g.lineTo(X,Y);g.stroke()}function circle(x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill()}function drawRoom(){g.fillStyle='#162b3a';g.fillRect(0,0,W,H);let light=g.createRadialGradient(W*.7,H*.24,0,W*.7,H*.24,W*.8);light.addColorStop(0,'#294a59');light.addColorStop(1,'#122431');g.fillStyle=light;g.fillRect(0,0,W,H);g.fillStyle='#0c1e30';g.fillRect(W*.54,115,W*.36,H*.3);g.strokeStyle='#557785';g.lineWidth=7;g.strokeRect(W*.54,115,W*.36,H*.3);line(W*.72,115,W*.72,115+H*.3,'#557785',5);circle(W*.79,155,20,'#e6edc2');g.fillStyle='#162b3a';g.beginPath();g.ellipse(W*.15,H*.62,90,30,0,0,7);g.fill();g.fillStyle='#263e4b';g.fillRect(0,H*.65,W,H*.35);line(0,H*.65,W,H*.65,'#4b6069');g.fillStyle='#405867';g.beginPath();g.roundRect(W*.05,H*.53,W*.38,H*.13,15);g.fill();g.fillStyle='#a0b7b5';g.beginPath();g.roundRect(W*.08,H*.54,W*.17,H*.06,12);g.fill();}
function frame(ms){let dt=Math.min((ms-last)/1000,.035)||0;last=ms;time=ms/1000;if(running)elapsed+=dt;if(bonus)drawMeadow();else drawRoom();drawObstacles();if(zapQueue>0){zapClock-=dt;if(zapClock<=0){if(navigator.vibrate)navigator.vibrate(18);zapQueue--;zapClock=.075;}}if(running){for(let bug of bugs){bug.phase+=dt;let stopped=Math.sin(bug.phase*1.4)>.85;if(!bonus&&level===8){bug.x=W/2+Math.sin(time*2.8+bug.phase)*W*.35;bug.y=H*.35+Math.cos(time*2.8+bug.phase)*H*.16;}else if(!bonus&&level===9){let cycle=(time+bug.phase)%5;if(cycle<2){bug.x=W*(.2+.2*(bugs.indexOf(bug)%4));bug.y=H*.35;}else{bug.x+=Math.sin(time*8+bug.phase)*180*dt;bug.y+=Math.cos(time*5+bug.phase)*120*dt;}}else if(!bonus&&level===6&&!bug.alert){}else if(!stopped){bug.x+=(bug.vx+Math.sin(time*4+bug.phase)*27)*dt;bug.y+=(bug.vy+Math.cos(time*3+bug.phase)*22)*dt}if(bug.x<25||bug.x>W-25){bug.vx*=-1;bug.x=Math.max(25,Math.min(W-25,bug.x))}if(bug.y<130||bug.y>(bonus?H-100:H*.61)){bug.vy*=-1;bug.y=Math.max(130,Math.min(bonus?H-100:H*.61,bug.y))}}for(let ball of balls){ball.trail.push({x:ball.x,y:ball.y});if(ball.trail.length>8)ball.trail.shift();let oldX=ball.x,oldY=ball.y;if(!bonus&&level===4)ball.vx+=120*dt;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;let hit=obstacles.find(o=>!o.broken&&segmentHit(oldX,oldY,ball.x,ball.y,o.x,o.y,o.r+6));if(hit){shatter(hit);break}for(let i=bugs.length-1;i>=0;i--){let bug=bugs[i];if(!(level===5&&!bonus&&bug.x>W*.33&&bug.x<W*.67)&&segmentHit(oldX,oldY,ball.x,ball.y,bug.x,bug.y,25)){for(let j=0;j<12;j++)sparks.push({x:bug.x,y:bug.y,vx:rnd(-120,120),vy:rnd(-120,120),life:.5});bugs.splice(i,1);ball.dead=true;kills++;ping();if(navigator.vibrate)navigator.vibrate(25);break}}}if(!bonus&&level===6&&balls.some(b=>!b.dead&&(b.y<0||b.x<0||b.x>W)))bugs.forEach(b=>b.alert=true);balls=balls.filter(b=>!b.dead&&b.x>-20&&b.x<W+20&&b.y>-20&&b.y<H+30);if(bonus){if(running&&elapsed>=20)finishBonus();else if(running&&bugs.length<40)bugs.push({x:rnd(25,W-25),y:rnd(140,H-100),vx:rnd(-70,70),vy:rnd(-45,45),phase:rnd(0,7)})}else if(running&&!bugs.length)finish(false)}if(gain){gain.gain.setTargetAtTime(running&&!muted?.018*Math.min(bugs.length,4):0,audio.currentTime,.1);osc.frequency.setTargetAtTime(190+Math.sin(time*4)*35,audio.currentTime,.1)}for(let bug of bugs){g.save();g.translate(bug.x,bug.y);g.fillStyle='#c4e5e57d';g.beginPath();g.ellipse(-9,-5,12,4,Math.sin(time*90),0,7);g.ellipse(9,-5,12,4,-Math.sin(time*90),0,7);g.fill();for(let s of [-1,1]){line(0,0,s*12,9,'#a0bdc0');line(s*12,9,s*17,5,'#a0bdc0')}g.fillStyle='#10171d';g.beginPath();g.ellipse(0,2,5,12,.2,0,7);g.fill();circle(0,-9,5,'#10171d');circle(2,-10,2,'#f1936e');line(0,-11,3,-22,'#bad0d0',1);g.restore()}if(!bonus&&level===5){g.fillStyle='#82586e';g.fillRect(W*.33,120,W*.34,H*.48);for(let x=W*.35;x<W*.67;x+=15)line(x,120,x,H*.48+120,'#634154',3)}if(!bonus&&level===4){circle(45,H*.65,26,'#8babb9');for(let j=0;j<3;j++){let a=time*15+j*2.094;line(45,H*.65,45+Math.cos(a)*23,H*.65+Math.sin(a)*23,'#d0e5dd',7)}for(let j=0;j<3;j++)line(80,H*.58+j*25,120+(time*50)%W,H*.58+j*25,'#bce7eb44',2)}for(let ball of balls){ball.trail.forEach((p,i)=>circle(p.x,p.y,2+i*.35,'#e4f59355'));circle(ball.x,ball.y,5,'#edffab')}sparks=sparks.filter(s=>s.life>0);for(let s of sparks){s.life-=dt;s.x+=s.vx*dt;s.y+=s.vy*dt;g.globalAlpha=Math.max(0,s.life*2);circle(s.x,s.y,3,'#e4f593')}g.globalAlpha=1;if(bonus){drawRacket()}else{let b=base(),p=drag||b;line(b.x,b.y+48,b.x,b.y+13,'#b58251',16);line(b.x,b.y+16,b.x-26,b.y-20,'#b58251',13);line(b.x,b.y+16,b.x+26,b.y-20,'#b58251',13);line(b.x-26,b.y-20,p.x,p.y,'#e5d7a7',4);line(b.x+26,b.y-20,p.x,p.y,'#e5d7a7',4);circle(p.x,p.y,9,'#e4f593');if(drag){for(let i=1;i<12;i++){let x=p.x+(b.x-p.x)*i*.8,y=p.y+(b.y-p.y)*i*.8;if(y<120)break;circle(x,y,2,'#e4f59366')}}}stats.innerHTML=bonus?`<b>BONUS</b> · ${Math.max(0,20-elapsed).toFixed(1)} 秒<br>撃退 <b>${bonusCount}</b> 匹`:`<span style="font-size:12px">第${level}夜 / 9</span> · 残り <b>${bugs.length}</b> 匹<br><span style="font-size:12px;color:#9db8bd">${elapsed.toFixed(1)} 秒 ／ ${shots} 発</span>`;requestAnimationFrame(frame)}requestAnimationFrame(frame);document.addEventListener('visibilitychange',()=>{if(audio){if(document.hidden)audio.suspend();else if(running)audio.resume()}});
</script></html>
